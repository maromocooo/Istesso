[package]
name = "istesso-scope"
description = "Prototype: runs a command under an agent scope level (Landlock on Linux). Not part of the trial build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "istesso-scope"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# The question at the edge of a scope goes to the owner's device over the Istesso link.
istesso-link.workspace = true
istesso-pair.workspace = true
serde.workspace = true
serde_json.workspace = true
# The grants file (O_NOFOLLOW, the owner's id) and the test form's prompt (poll), on every
# system; the Landlock calls on Linux. MIT OR Apache-2.0.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock system calls (ADR 0026, docs/research/agent-scope-proto.md). MIT OR Apache-2.0.
landlock = "0.4.7"
