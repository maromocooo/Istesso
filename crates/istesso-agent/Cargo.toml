[package]
name = "istesso-agent"
description = "The resident part of Istesso: answers paired devices and keeps track of them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
istesso-proto.workspace = true
istesso-pair.workspace = true
istesso-link.workspace = true
istesso-doctor.workspace = true
istesso-catalog.workspace = true
serde.workspace = true
serde_json.workspace = true
mdns-sd.workspace = true

# Pseudo-terminals, the user database and terminal modes for the remote shell
# (src/remote_shell). Already in the tree through istesso-pair.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Git's ignore rules, for the folders shown to other devices (src/mount).
ignore.workspace = true
# The same name in either Unicode form, on the Mac's file systems (src/mount).
unicode-normalization.workspace = true
