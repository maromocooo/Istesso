[package]
name = "istesso-pair"
description = "Secure pairing between devices: short code, PAKE key agreement, pinned device keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
spake2.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand_core.workspace = true

# The lock that lets several processes change the peer store without losing
# each other's changes (`flock`). Already in the tree through istesso-media.
# Not through the workspace table yet, for the reason given in
# crates/istesso-media/Cargo.toml.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
