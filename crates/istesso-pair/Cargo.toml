[package]
name = "istesso-pair"
description = "Secure pairing between devices: short code, PAKE key agreement, pinned device keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
spake2.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand_core.workspace = true

# The lock that lets several processes change the peer store without losing
# each other's changes (`flock`). Already in the tree through istesso-media.
# Not through the workspace table yet, for the reason given in
# crates/istesso-media/Cargo.toml.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only with `login-keychain`, only on macOS: the system's Security framework,
# for the login keychain. MIT OR Apache-2.0, as are the crates it brings in
# (docs/components.md).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }

[features]
# macOS builds that are signed with a certificate: keep the device key and the
# list of paired devices as items of the login keychain instead of files
# (docs/adr/0006-pairing.md, "鍵とペアの一覧の置き場所"). Decided when the
# program is built, never by an argument or the environment.
login-keychain = ["dep:security-framework"]
