[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
istesso-proto = { path = "crates/istesso-proto" }
istesso-doctor = { path = "crates/istesso-doctor" }
istesso-catalog = { path = "crates/istesso-catalog" }
istesso-pair = { path = "crates/istesso-pair" }
istesso-link = { path = "crates/istesso-link" }
istesso-agent = { path = "crates/istesso-agent" }
istesso-measure = { path = "crates/istesso-measure" }
istesso-device-api = { path = "crates/istesso-device-api" }
istesso-device-adapters = { path = "crates/istesso-device-adapters" }

# Third-party crates. Every dependency must pass the licence allowlist in deny.toml.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
plist = "1"
spake2 = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# Noise protocol for the control channel. Only the primitives we use are enabled.
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
if-addrs = "0.15"
mdns-sd = { version = "0.21", default-features = false }
unicode-width = "0.2"
zeroize = "1"
# Window and pixels for the test application (istesso-flash) only. X11 and Wayland are loaded at
# run time, so building needs no system headers. No client-side decorations: inside the
# streaming compositor the window is borderless, and elsewhere the window manager draws them.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland", "x11"] }
glow = "0.18"
# Device framework (ADR 0012). Reasons and licences are in docs/components.md.
# Pinned: later 0.25 releases need a newer Rust than this workspace asks for.
image = { version = "=0.25.6", default-features = false, features = ["jpeg"] }
# No default features: the default Linux backend needs the system's libudev,
# and the libusb backends would bring in LGPL code.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
# Only in tests of the device framework. Already in the tree through serde and clap.
proc-macro2 = "1"

# Audio (istesso-audio), kept as one block at the end of this table.
istesso-audio = { path = "crates/istesso-audio" }
# A resampler whose ratio can be moved while it runs. Only the sinc resampler is used, so the FFT
# one and its dependencies stay out.
rubato = { version = "4.0", default-features = false }
audioadapter-buffers = "4.0"
# Hands samples to and from the threads of the sound system without waiting.
rtrb = "0.4"
# Core Audio (macOS only): the output unit, and the clock its time stamps are in.
coreaudio-rs = { version = "0.14", default-features = false, features = ["audio_unit", "core_audio"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "HostTime", "AudioHardware"] }
# PipeWire (Linux only, and only with the `pipewire` feature of istesso-audio): the capture.
# libc for the clock PipeWire stamps its cycles with.
# v0_3_49: a stream is told how many frames to produce.
pipewire = { version = "0.10", features = ["v0_3_49"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

# The audio path does arithmetic on every sample. Unoptimised, the resampler cannot keep up with a
# sound card, and the simulated-clock tests of the drift correction take minutes, not seconds.
[profile.dev.package.istesso-audio]
opt-level = 2

[profile.dev.package.rubato]
opt-level = 3
