[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
ud-proto = { path = "crates/ud-proto" }
ud-doctor = { path = "crates/ud-doctor" }
ud-catalog = { path = "crates/ud-catalog" }
ud-pair = { path = "crates/ud-pair" }

# Third-party crates. Every dependency must pass the licence allowlist in deny.toml.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
plist = "1"
spake2 = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = "thin"
strip = true
