[package]
name = "unified-mount-proto"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Research prototype: show a folder that lives on another machine at a fixed path, read-only, through a loopback NFSv3 server and the built-in macOS NFS client."

# Its own workspace: this prototype is not part of the product workspace.
[workspace]

[dependencies]
nfsserve = "0.11"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
