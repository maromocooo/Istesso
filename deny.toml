# Licence policy for everything that gets compiled into this project.
#
# Rule: only code we could ship under "MIT OR Apache-2.0" goes in.
# Copyleft code (GPL, AGPL, LGPL-as-static-link) must never be added as a crate.
# File-level copyleft (MPL-2.0) is not allowed globally; adopt it per crate
# through an explicit entry in [[licenses.exceptions]] after review
# (see docs/components.md).

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# Example for a reviewed MPL-2.0 dependency:
# [[licenses.exceptions]]
# name = "some-crate"
# allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of this workspace refer to each other by path, without a version.
# That is fine for crates that are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"

# hidapi: the crate is MIT. On macOS it compiles the HIDAPI C library that it
# bundles, which may be used under GPL-3.0, a BSD-style licence or the original
# HIDAPI licence, at the user's choice. We use it under the BSD-style licence
# (decided 2026-11-17; text in third-party-licenses/HIDAPI-LICENSE-bsd.txt).
# The hashes tie this statement to the licence files of the version we build;
# a new version of the crate has to be looked at again.
[[licenses.clarify]]
crate = "hidapi"
expression = "MIT AND BSD-3-Clause"
license-files = [
    { path = "LICENSE.txt", hash = 0xf528ab0f },
    { path = "etc/hidapi/LICENSE-bsd.txt", hash = 0x520271c7 },
]
