name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test the private details checker
        run: bash scripts/tests/check-private-test.sh
      - name: Check that the measurement scripts parse
        run: python3 -m py_compile scripts/*.py
      - name: Test the main editor prototype's launchers (no editor or app is started)
        if: runner.os == 'Linux'
        run: |
          python3 -I scripts/tests/proto-editor-window-test.py
          python3 -I scripts/tests/proto-editor-window-mac-test.py
      - name: Test the Mac's window opener with the system's ps (stand-ins sleep; no window)
        run: python3 -I scripts/tests/proto-editor-viewer-test.py
      - name: Build the screen probe
        if: runner.os == 'macOS'
        run: swift build --package-path macos/screen-probe
      - name: Test which keys the viewer passes on
        if: runner.os == 'macOS'
        run: cc -Wall -Wextra -o keys-test macos/gst-viewer/keys-test.c && ./keys-test

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
