name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check that the measurement scripts parse
        run: python3 -m py_compile scripts/*.py
      - name: Build the screen probe
        if: runner.os == 'macOS'
        run: swift build --package-path macos/screen-probe
      - name: Test which keys the viewer passes on
        if: runner.os == 'macOS'
        run: cc -Wall -Wextra -o keys-test macos/gst-viewer/keys-test.c && ./keys-test

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The Linux capture sits behind a cargo feature because it needs
  # PipeWire's development files to build. This job turns it on; no other
  # job installs anything.
  pipewire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: PipeWire's development files
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev
      - name: Lint
        run: cargo clippy --workspace --all-targets --features istesso-cli/pipewire -- -D warnings
      - name: Test
        run: cargo test --workspace --features istesso-cli/pipewire
