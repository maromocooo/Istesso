# Installed by the istesso package as /etc/security/limits.d/40-istesso.conf.
#
# Lets the members of the group "istesso" run threads with real-time priority and a lower
# nice value, so that capturing and sending pictures and sound is not delayed by other work.
#
# Only these two limits. The file that the distribution's PipeWire package installs
# (25-pw-rlimits.conf, group "pipewire") also sets the locked-memory limit; a user who is in
# that group and in this one gets the limits of both files. This file never sets "memlock"
# and nothing here lowers it.
#
# Add a user:      gpasswd -a <user> istesso      (takes effect at the next start of that user's services)
# Take one away:   gpasswd -d <user> istesso
@istesso  -  rtprio  95
@istesso  -  nice    -19
